[build-system]
requires = ["uv_build==0.11.29"]
build-backend = "uv_build"

[project]
name = "skillscout"
version = "0.1.0"
description = "Auditable discovery and generation pipeline for Agent Skills"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "openai==2.46.0",
    "pydantic==2.13.4",
]

[project.scripts]
skillscout = "skillscout.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
