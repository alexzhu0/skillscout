name: Phase 6 adversarial MVP acceptance

on:
  workflow_dispatch:
    inputs:
      phase6_action:
        description: Select one closed Phase 6 authority transition
        required: true
        type: choice
        options:
          - isolation-probe
          - nominate
          - offline-adversarial
          - run-benchmark
          - run-replay
          - run-changed-source
          - gate-b4-and-publish
          - record-human-review
          - record-probe-cleanup
          - rebuild-report

permissions:
  contents: read

concurrency:
  group: skillscout-phase6-acceptance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  isolation_probe:
    if: ${{ inputs.phase6_action == 'isolation-probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Materialize the pinned uv binary
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.29
          enable-cache: false

      - name: Verify the repository-local locked toolchain
        run: |
          set -euo pipefail
          mkdir -p .tools/uv-0.11.29/bin
          install -m 0755 "$(command -v uv)" .tools/uv-0.11.29/bin/uv
          test -x .tools/uv-0.11.29/bin/uv
          uv_version_output="$(.tools/uv-0.11.29/bin/uv --version)"
          if [[ "$uv_version_output" != "uv 0.11.29" && ! "$uv_version_output" =~ ^uv\ 0\.11\.29\ \([^()]+\)$ ]]; then
            exit 1
          fi
          repository_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          test "${repository_root}" = "${GITHUB_WORKSPACE}"
          test "${repository_root}" = "$(pwd -P)"
          tools_root="${repository_root}/.tools"
          test ! -L "${tools_root}"
          test "$(realpath -e -- "${tools_root}")" = "${tools_root}"
          managed_python_root="${tools_root}/python"
          test "${managed_python_root}" = "${GITHUB_WORKSPACE}/.tools/python"
          if [[ -L "${managed_python_root}" ]]; then
            exit 1
          fi
          if [[ -e "${managed_python_root}" ]]; then
            test -d "${managed_python_root}"
            test "$(realpath -e -- "${managed_python_root}")" = "${managed_python_root}"
          else
            mkdir -m 0755 "${managed_python_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 .tools/uv-0.11.29/bin/uv python install 3.13.14 --install-dir "${managed_python_root}" --no-bin
          managed_python_executable="$(
            UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never \
              .tools/uv-0.11.29/bin/uv python find --managed-python 3.13.14
          )"
          [[ -n "$managed_python_executable" && "$managed_python_executable" != *$'\n'* && "$managed_python_executable" == /* ]]
          managed_python_executable="$(realpath -e -- "${managed_python_executable}")"
          case "${managed_python_executable}" in
            "${managed_python_root}"/*/bin/python*) ;;
            *) exit 1 ;;
          esac
          test -x "${managed_python_executable}"
          venv_root="${repository_root}/.venv"
          test "${venv_root}" = "${GITHUB_WORKSPACE}/.venv"
          if [[ -L "${venv_root}" ]]; then
            exit 1
          fi
          if [[ -e "${venv_root}" ]]; then
            test -d "${venv_root}"
            test "$(realpath -e -- "${venv_root}")" = "${venv_root}"
            rm -rf -- "${venv_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never .tools/uv-0.11.29/bin/uv sync --locked --python "${managed_python_executable}" --managed-python --no-python-downloads
          python_executable="$(realpath -e -- .venv/bin/python)"
          python_base_prefix="$(.venv/bin/python -I -c 'import sys; print(sys.base_prefix)')"
          [[ -n "$python_base_prefix" && "$python_base_prefix" != *$'\n'* && "$python_base_prefix" == /* ]]
          python_base_prefix="$(realpath -e -- "${python_base_prefix}")"
          case "${python_base_prefix}" in
            "${managed_python_root}"/*) ;;
            *) exit 1 ;;
          esac
          case "${python_executable}" in
            "${python_base_prefix}"/bin/python*) ;;
            *) exit 1 ;;
          esac
          test "$(.venv/bin/python -I -c 'import sys; print(sys.implementation.name)')" = "cpython"
          test "$(.venv/bin/python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          test -d "${python_base_prefix}/lib/python3.13"
          test -f "${python_base_prefix}/lib/python3.13/os.py"
          test -f "${python_base_prefix}/lib/python3.13/encodings/__init__.py"
          {
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "${managed_python_root}"
            printf 'UV_MANAGED_PYTHON=1\n'
            printf 'UV_PYTHON_DOWNLOADS=never\n'
          } >> "${GITHUB_ENV}"

      - name: Run the fail-closed network-isolation probe
        env:
          PHASE6_SOURCE_COMMIT: ${{ github.sha }}
          PHASE6_RUN_ID: ${{ github.run_id }}
          PHASE6_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          repository_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          test "${repository_root}" = "${GITHUB_WORKSPACE}"
          test "${repository_root}" = "$(pwd -P)"
          managed_python_root="$(realpath -e -- "${repository_root}/.tools/python")"
          test "${managed_python_root}" = "${repository_root}/.tools/python"
          python_base_prefix_output="$(
            .venv/bin/python -I -c 'import sys; print(sys.base_prefix, end="\n__PHASE6_BASE_PREFIX_END__")'
          )"
          python_base_prefix_sentinel=$'\n__PHASE6_BASE_PREFIX_END__'
          [[ "$python_base_prefix_output" == *"$python_base_prefix_sentinel" ]]
          python_base_prefix="${python_base_prefix_output%"$python_base_prefix_sentinel"}"
          [[ -n "$python_base_prefix" && "$python_base_prefix" != *$'\n'* && "$python_base_prefix" == /* ]]
          python_base_prefix="$(realpath -e -- "${python_base_prefix}")"
          case "$python_base_prefix" in
            "${managed_python_root}"/*) ;;
            *) exit 1 ;;
          esac
          python_executable="$(realpath -e -- .venv/bin/python)"
          case "$python_executable" in
            "${python_base_prefix}"/bin/python*) ;;
            *) exit 1 ;;
          esac
          test -x "${python_executable}"
          test "$(.venv/bin/python -I -c 'import sys; print(sys.implementation.name)')" = "cpython"
          test "$(.venv/bin/python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          test -d "${python_base_prefix}/lib/python3.13"
          test -f "${python_base_prefix}/lib/python3.13/os.py"
          test -f "${python_base_prefix}/lib/python3.13/encodings/__init__.py"
          probe_root="${RUNNER_TEMP}/phase6-isolation-probe"
          mkdir -p "${probe_root}"
          docker_server_version="$(docker version --format '{{.Server.Version}}')"
          kernel_identity="$(uname -srvmo)"
          repository_root="$(pwd -P)"
          image_tag="phase6-host-runtime:${PHASE6_SOURCE_COMMIT}"
          tar -cf "${probe_root}/empty-rootfs.tar" --files-from /dev/null
          docker_image_id="$(
            docker import "${probe_root}/empty-rootfs.tar" "${image_tag}"
          )"
          trap 'docker image rm -f "${image_tag}" >/dev/null 2>&1 || true; rm -f "${probe_root}/control.log" "${probe_root}/direct.log" "${probe_root}/child.log" "${probe_root}/direct_probe.py" "${probe_root}/child_probe.py" "${probe_root}/empty-rootfs.tar"' EXIT

          cat >"${probe_root}/direct_probe.py" <<'PY'
          import errno
          import socket
          import sys

          sock = socket.socket()
          sock.settimeout(5)
          result = sock.connect_ex(("192.0.2.1", 443))
          denied = {
              errno.EACCES,
              errno.EHOSTUNREACH,
              errno.ENETDOWN,
              errno.ENETUNREACH,
              errno.EPERM,
          }
          raise SystemExit(0 if result == 0 else 97 if result in denied else 98)
          PY

          cat >"${probe_root}/child_probe.py" <<'PY'
          import subprocess
          import sys

          child = subprocess.run(
              [sys.executable, "/probe/direct_probe.py"],
              check=False,
          )
          raise SystemExit(child.returncode)
          PY

          set +e
          # Docker's private loopback remains available; external success is forbidden.
          docker run --network none --rm \
            --volume /bin:/bin:ro \
            --volume /etc:/etc:ro \
            --volume /lib:/lib:ro \
            --volume /lib64:/lib64:ro \
            --volume /usr:/usr:ro \
            --env "UV_PYTHON_INSTALL_DIR=${repository_root}/.tools/python" \
            --env UV_MANAGED_PYTHON=1 \
            --env UV_PYTHON_DOWNLOADS=never \
            --volume "${repository_root}:${repository_root}:ro" \
            --workdir "${repository_root}" \
            "${image_tag}" \
            .tools/uv-0.11.29/bin/uv run --locked --offline --no-sync \
            pytest -q tests/test_phase6_workflow.py \
            -k "isolation or workflow or permission or secret" -x \
            >"${probe_root}/control.log" 2>&1
          control_status=$?

          docker run --network none --rm \
            --volume /bin:/bin:ro \
            --volume /etc:/etc:ro \
            --volume /lib:/lib:ro \
            --volume /lib64:/lib64:ro \
            --volume /usr:/usr:ro \
            --env "UV_PYTHON_INSTALL_DIR=${repository_root}/.tools/python" \
            --env UV_MANAGED_PYTHON=1 \
            --env UV_PYTHON_DOWNLOADS=never \
            --volume "${repository_root}:${repository_root}:ro" \
            --volume "${probe_root}:/probe:ro" \
            --workdir "${repository_root}" \
            "${image_tag}" \
            .tools/uv-0.11.29/bin/uv run --locked --offline --no-sync \
            python /probe/direct_probe.py \
            >"${probe_root}/direct.log" 2>&1
          direct_status=$?

          docker run --network none --rm \
            --volume /bin:/bin:ro \
            --volume /etc:/etc:ro \
            --volume /lib:/lib:ro \
            --volume /lib64:/lib64:ro \
            --volume /usr:/usr:ro \
            --env "UV_PYTHON_INSTALL_DIR=${repository_root}/.tools/python" \
            --env UV_MANAGED_PYTHON=1 \
            --env UV_PYTHON_DOWNLOADS=never \
            --volume "${repository_root}:${repository_root}:ro" \
            --volume "${probe_root}:/probe:ro" \
            --workdir "${repository_root}" \
            "${image_tag}" \
            .tools/uv-0.11.29/bin/uv run --locked --offline --no-sync \
            python /probe/child_probe.py \
            >"${probe_root}/child.log" 2>&1
          child_status=$?
          set -e

          test "${control_status}" -eq 0
          test "${direct_status}" -eq 97
          test "${child_status}" -eq 97

          export PHASE6_PROBE_ROOT="${probe_root}"
          export PHASE6_DOCKER_IMAGE_ID="${docker_image_id}"
          export PHASE6_DOCKER_SERVER_VERSION="${docker_server_version}"
          export PHASE6_KERNEL_IDENTITY="${kernel_identity}"
          export PHASE6_CONTROL_OUTCOME="passed"
          export PHASE6_DIRECT_OUTCOME="denied"
          export PHASE6_CHILD_OUTCOME="denied"
          export PHASE6_SYNTHETIC_CANARY="phase6-synthetic-canary-do-not-persist"
          export PHASE6_WORKFLOW_SHA256
          PHASE6_WORKFLOW_SHA256="$(
            sha256sum .github/workflows/phase6-acceptance.yml | cut -d' ' -f1
          )"

          .tools/uv-0.11.29/bin/uv run --locked --offline --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PHASE6_PROBE_ROOT"])
          scanned = tuple(root / name for name in ("control.log", "direct.log", "child.log"))
          canary = os.environ["PHASE6_SYNTHETIC_CANARY"].encode()
          hit_count = sum(path.read_bytes().count(canary) for path in scanned)
          if hit_count:
              raise SystemExit("synthetic canary reached an allowlisted diagnostic")

          control_command = (
              ".tools/uv-0.11.29/bin/uv run --locked --offline --no-sync "
              "pytest -q tests/test_phase6_workflow.py "
              '-k "isolation or workflow or permission or secret" -x'
          )
          direct_command = (
              ".tools/uv-0.11.29/bin/uv run --locked --offline --no-sync "
              "python /probe/direct_probe.py\n"
          ).encode() + (root / "direct_probe.py").read_bytes()
          child_command = (
              ".tools/uv-0.11.29/bin/uv run --locked --offline --no-sync "
              "python /probe/child_probe.py\n"
          ).encode() + (root / "child_probe.py").read_bytes()
          evidence = {
              "schema_version": "phase6.hosted-isolation-evidence.v1",
              "non_authoritative": True,
              "workflow_sha256": os.environ["PHASE6_WORKFLOW_SHA256"],
              "source_commit_sha": os.environ["PHASE6_SOURCE_COMMIT"],
              "hosted_run_id": os.environ["PHASE6_RUN_ID"],
              "run_attempt": int(os.environ["PHASE6_RUN_ATTEMPT"]),
              "runner_image": (
                  os.environ.get("ImageOS", "ubuntu24")
                  + "-"
                  + os.environ.get("ImageVersion", "unknown")
              )[:128],
              "kernel_identity": os.environ["PHASE6_KERNEL_IDENTITY"][:256],
              "docker_server_version": os.environ["PHASE6_DOCKER_SERVER_VERSION"][:64],
              "docker_image_id": os.environ["PHASE6_DOCKER_IMAGE_ID"][:128],
              "isolation_mechanism": "docker_network_none",
              "control_command_digest": hashlib.sha256(
                  control_command.encode()
              ).hexdigest(),
              "direct_probe_command_digest": hashlib.sha256(
                  direct_command
              ).hexdigest(),
              "child_probe_command_digest": hashlib.sha256(
                  child_command
              ).hexdigest(),
              "control_outcome": os.environ["PHASE6_CONTROL_OUTCOME"],
              "direct_network_outcome": os.environ["PHASE6_DIRECT_OUTCOME"],
              "child_network_outcome": os.environ["PHASE6_CHILD_OUTCOME"],
              "credential_count": 0,
              "state_write_capability": False,
              "synthetic_scan_manifest_digest": hashlib.sha256(
                  json.dumps(
                      [path.name for path in scanned],
                      separators=(",", ":"),
                  ).encode()
              ).hexdigest(),
              "synthetic_canary_hit_count": hit_count,
              "artifact_retention_days": 1,
          }
          destination = root / "evidence.json"
          destination.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          chmod 600 "${probe_root}/evidence.json"

      - name: Upload the bounded noncanonical evidence
        id: upload-probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-isolation-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase6-isolation-probe/evidence.json
          if-no-files-found: error
          retention-days: 1

  nominate:
    if: ${{ inputs.phase6_action == 'nominate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      UV_LINK_MODE: copy
      SKILLSCOUT_SOURCE_GITHUB_TOKEN: ${{ github.token }}
      SKILLSCOUT_STATE_GITHUB_TOKEN: ${{ github.token }}
      SKILLSCOUT_STATE_REPOSITORY_ID: ${{ vars.SKILLSCOUT_STATE_REPOSITORY_ID }}
      SKILLSCOUT_STATE_REPOSITORY_FULL_NAME: ${{ vars.SKILLSCOUT_STATE_REPOSITORY_FULL_NAME }}
      SKILLSCOUT_INITIAL_STATE_ROOT_DIGEST: sha256:b4167cffc31969854260d4acd58b804f4823a4d25d078ef3b5dc88445b75c2e5
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize the pinned uv binary
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.29
          enable-cache: false
      - name: Verify the repository-local locked toolchain
        run: |
          set -euo pipefail
          mkdir -p .tools/uv-0.11.29/bin
          install -m 0755 "$(command -v uv)" .tools/uv-0.11.29/bin/uv
          test -x .tools/uv-0.11.29/bin/uv
          uv_version_output="$(.tools/uv-0.11.29/bin/uv --version)"
          if [[ "$uv_version_output" != "uv 0.11.29" && ! "$uv_version_output" =~ ^uv\ 0\.11\.29\ \([^()]+\)$ ]]; then
            exit 1
          fi
          repository_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          test "${repository_root}" = "${GITHUB_WORKSPACE}"
          test "${repository_root}" = "$(pwd -P)"
          tools_root="${repository_root}/.tools"
          test ! -L "${tools_root}"
          test "$(realpath -e -- "${tools_root}")" = "${tools_root}"
          managed_python_root="${tools_root}/python"
          test "${managed_python_root}" = "${GITHUB_WORKSPACE}/.tools/python"
          if [[ -L "${managed_python_root}" ]]; then
            exit 1
          fi
          if [[ -e "${managed_python_root}" ]]; then
            test -d "${managed_python_root}"
            test "$(realpath -e -- "${managed_python_root}")" = "${managed_python_root}"
          else
            mkdir -m 0755 "${managed_python_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 .tools/uv-0.11.29/bin/uv python install 3.13.14 --install-dir "${managed_python_root}" --no-bin
          managed_python_executable="$(
            UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never \
              .tools/uv-0.11.29/bin/uv python find --managed-python 3.13.14
          )"
          [[ -n "$managed_python_executable" && "$managed_python_executable" != *$'\n'* && "$managed_python_executable" == /* ]]
          managed_python_executable="$(realpath -e -- "${managed_python_executable}")"
          case "${managed_python_executable}" in
            "${managed_python_root}"/*/bin/python*) ;;
            *) exit 1 ;;
          esac
          test -x "${managed_python_executable}"
          venv_root="${repository_root}/.venv"
          test "${venv_root}" = "${GITHUB_WORKSPACE}/.venv"
          if [[ -L "${venv_root}" ]]; then
            exit 1
          fi
          if [[ -e "${venv_root}" ]]; then
            test -d "${venv_root}"
            test "$(realpath -e -- "${venv_root}")" = "${venv_root}"
            rm -rf -- "${venv_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never .tools/uv-0.11.29/bin/uv sync --locked --python "${managed_python_executable}" --managed-python --no-python-downloads
          python_executable="$(realpath -e -- .venv/bin/python)"
          python_base_prefix="$(.venv/bin/python -I -c 'import sys; print(sys.base_prefix)')"
          [[ -n "$python_base_prefix" && "$python_base_prefix" != *$'\n'* && "$python_base_prefix" == /* ]]
          python_base_prefix="$(realpath -e -- "${python_base_prefix}")"
          case "${python_base_prefix}" in
            "${managed_python_root}"/*) ;;
            *) exit 1 ;;
          esac
          case "${python_executable}" in
            "${python_base_prefix}"/bin/python*) ;;
            *) exit 1 ;;
          esac
          test "$(.venv/bin/python -I -c 'import sys; print(sys.implementation.name)')" = "cpython"
          test "$(.venv/bin/python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          test -d "${python_base_prefix}/lib/python3.13"
          test -f "${python_base_prefix}/lib/python3.13/os.py"
          test -f "${python_base_prefix}/lib/python3.13/encodings/__init__.py"
          {
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "${managed_python_root}"
            printf 'UV_MANAGED_PYTHON=1\n'
            printf 'UV_PYTHON_DOWNLOADS=never\n'
          } >> "${GITHUB_ENV}"
      - name: Nominate the bounded Search-derived benchmark
        run: |
          set -euo pipefail
          umask 077
          result_file="${RUNNER_TEMP}/phase6-nomination.json"
          .tools/uv-0.11.29/bin/uv run --locked python -m skillscout.cli nominate-benchmark --state-repository-id "$SKILLSCOUT_STATE_REPOSITORY_ID" --state-repository-full-name "$SKILLSCOUT_STATE_REPOSITORY_FULL_NAME" --initial-state-root-digest "$SKILLSCOUT_INITIAL_STATE_ROOT_DIGEST" > "$result_file"
          test -s "$result_file"
      - name: Upload the bounded nomination result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-nomination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase6-nomination.json
          if-no-files-found: error
          retention-days: 1

  offline_adversarial:
    if: ${{ inputs.phase6_action == 'offline-adversarial' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PHASE6_SOURCE_COMMIT: ${{ github.sha }}
      PHASE6_RUN_ID: ${{ github.run_id }}
      PHASE6_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize the pinned uv binary
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.29
          enable-cache: false
      - name: Verify the repository-local locked toolchain
        run: |
          set -euo pipefail
          mkdir -p .tools/uv-0.11.29/bin
          install -m 0755 "$(command -v uv)" .tools/uv-0.11.29/bin/uv
          test -x .tools/uv-0.11.29/bin/uv
          uv_version_output="$(.tools/uv-0.11.29/bin/uv --version)"
          if [[ "$uv_version_output" != "uv 0.11.29" && ! "$uv_version_output" =~ ^uv\ 0\.11\.29\ \([^()]+\)$ ]]; then
            exit 1
          fi
          repository_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          test "${repository_root}" = "${GITHUB_WORKSPACE}"
          test "${repository_root}" = "$(pwd -P)"
          tools_root="${repository_root}/.tools"
          test ! -L "${tools_root}"
          test "$(realpath -e -- "${tools_root}")" = "${tools_root}"
          managed_python_root="${tools_root}/python"
          test "${managed_python_root}" = "${GITHUB_WORKSPACE}/.tools/python"
          if [[ -L "${managed_python_root}" ]]; then
            exit 1
          fi
          if [[ -e "${managed_python_root}" ]]; then
            test -d "${managed_python_root}"
            test "$(realpath -e -- "${managed_python_root}")" = "${managed_python_root}"
          else
            mkdir -m 0755 "${managed_python_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 .tools/uv-0.11.29/bin/uv python install 3.13.14 --install-dir "${managed_python_root}" --no-bin
          managed_python_executable="$(
            UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never \
              .tools/uv-0.11.29/bin/uv python find --managed-python 3.13.14
          )"
          [[ -n "$managed_python_executable" && "$managed_python_executable" != *$'\n'* && "$managed_python_executable" == /* ]]
          managed_python_executable="$(realpath -e -- "${managed_python_executable}")"
          case "${managed_python_executable}" in
            "${managed_python_root}"/*/bin/python*) ;;
            *) exit 1 ;;
          esac
          test -x "${managed_python_executable}"
          venv_root="${repository_root}/.venv"
          test "${venv_root}" = "${GITHUB_WORKSPACE}/.venv"
          if [[ -L "${venv_root}" ]]; then
            exit 1
          fi
          if [[ -e "${venv_root}" ]]; then
            test -d "${venv_root}"
            test "$(realpath -e -- "${venv_root}")" = "${venv_root}"
            rm -rf -- "${venv_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never .tools/uv-0.11.29/bin/uv sync --locked --python "${managed_python_executable}" --managed-python --no-python-downloads
          python_executable="$(realpath -e -- .venv/bin/python)"
          python_base_prefix="$(.venv/bin/python -I -c 'import sys; print(sys.base_prefix)')"
          [[ -n "$python_base_prefix" && "$python_base_prefix" != *$'\n'* && "$python_base_prefix" == /* ]]
          python_base_prefix="$(realpath -e -- "${python_base_prefix}")"
          case "${python_base_prefix}" in
            "${managed_python_root}"/*) ;;
            *) exit 1 ;;
          esac
          case "${python_executable}" in
            "${python_base_prefix}"/bin/python*) ;;
            *) exit 1 ;;
          esac
          test "$(.venv/bin/python -I -c 'import sys; print(sys.implementation.name)')" = "cpython"
          test "$(.venv/bin/python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          test -d "${python_base_prefix}/lib/python3.13"
          test -f "${python_base_prefix}/lib/python3.13/os.py"
          test -f "${python_base_prefix}/lib/python3.13/encodings/__init__.py"
          {
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "${managed_python_root}"
            printf 'UV_MANAGED_PYTHON=1\n'
            printf 'UV_PYTHON_DOWNLOADS=never\n'
          } >> "${GITHUB_ENV}"
      - name: Run the fresh kernel-isolated adversarial campaign
        id: offline_campaign
        run: |
          set -euo pipefail
          umask 077
          campaign_root="${RUNNER_TEMP}/phase6-offline-adversarial"
          mkdir -p "${campaign_root}"
          diagnostic_path="${campaign_root}/failure-diagnostic.json"
          diagnostic_format='{"schema_version":"%s","source_commit_sha":"%s","workflow_sha256":"%s","hosted_run_id":%d,"run_attempt":%d,"stage":"%s","overall_status":%d,"control_status":%d,"direct_status":%d,"child_status":%d,"artifact_retention_days":1}\n'
          diagnostic_schema_version="phase6.offline-diagnostic.v1"
          diagnostic_workflow_sha256="absent"
          diagnostic_stage="runtime-preflight"
          overall_status=1
          control_status=-1
          direct_status=-1
          child_status=-1
          image_tag=""
          trap 'campaign_exit_status=$?; overall_status="$campaign_exit_status"; diagnostic_write_status=0; case "$diagnostic_stage" in runtime-preflight|control|direct-probe|child-probe|campaign-report|synthetic-scan|complete) ;; *) diagnostic_write_status=1 ;; esac; if [[ "$campaign_exit_status" -ne 0 && "$diagnostic_stage" = "control" && "$control_status" -ne 0 && -s "$diagnostic_path" ]]; then :; elif [[ "$diagnostic_write_status" -eq 0 ]]; then printf "$diagnostic_format" "$diagnostic_schema_version" "$PHASE6_SOURCE_COMMIT" "$diagnostic_workflow_sha256" "$PHASE6_RUN_ID" "$PHASE6_RUN_ATTEMPT" "$diagnostic_stage" "$overall_status" "$control_status" "$direct_status" "$child_status" >"$diagnostic_path" || diagnostic_write_status=$?; fi; if [[ -n "$image_tag" ]]; then docker image rm -f "$image_tag" >/dev/null 2>&1 || true; fi; rm -f "${campaign_root}/direct_probe.py" "${campaign_root}/child_probe.py" "${campaign_root}/empty-rootfs.tar" || true; if [[ "$campaign_exit_status" -ne 0 ]]; then exit "$campaign_exit_status"; fi; exit "$diagnostic_write_status"' EXIT
          repository_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          test "${repository_root}" = "${GITHUB_WORKSPACE}"
          test "${repository_root}" = "$(pwd -P)"
          managed_python_root="$(realpath -e -- "${repository_root}/.tools/python")"
          test "${managed_python_root}" = "${repository_root}/.tools/python"
          python_base_prefix_output="$(
            .venv/bin/python -I -c 'import sys; print(sys.base_prefix, end="\n__PHASE6_BASE_PREFIX_END__")'
          )"
          python_base_prefix_sentinel=$'\n__PHASE6_BASE_PREFIX_END__'
          [[ "$python_base_prefix_output" == *"$python_base_prefix_sentinel" ]]
          python_base_prefix="${python_base_prefix_output%"$python_base_prefix_sentinel"}"
          [[ -n "$python_base_prefix" && "$python_base_prefix" != *$'\n'* && "$python_base_prefix" == /* ]]
          python_base_prefix="$(realpath -e -- "${python_base_prefix}")"
          case "$python_base_prefix" in
            "${managed_python_root}"/*) ;;
            *) exit 1 ;;
          esac
          python_executable="$(realpath -e -- .venv/bin/python)"
          case "$python_executable" in
            "${python_base_prefix}"/bin/python*) ;;
            *) exit 1 ;;
          esac
          test -x "${python_executable}"
          test "$(.venv/bin/python -I -c 'import sys; print(sys.implementation.name)')" = "cpython"
          test "$(.venv/bin/python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          test -d "${python_base_prefix}/lib/python3.13"
          test -f "${python_base_prefix}/lib/python3.13/os.py"
          test -f "${python_base_prefix}/lib/python3.13/encodings/__init__.py"
          PHASE6_PRIOR_FAILED_PROBE_RUN_ID="30430010273"
          # The prior run's observed artifact count was zero; it grants no authority.
          repository_root="$(pwd -P)"
          export PHASE6_WORKFLOW_SHA256
          PHASE6_WORKFLOW_SHA256="$(
            sha256sum .github/workflows/phase6-acceptance.yml | cut -d' ' -f1
          )"
          [[ "$PHASE6_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          diagnostic_workflow_sha256="sha256:${PHASE6_WORKFLOW_SHA256}"
          image_tag="phase6-offline-runtime:${PHASE6_SOURCE_COMMIT}"
          tar -cf "${campaign_root}/empty-rootfs.tar" --files-from /dev/null
          docker import "${campaign_root}/empty-rootfs.tar" "${image_tag}" >/dev/null

          cat >"${campaign_root}/direct_probe.py" <<'PY'
          import errno
          import socket

          sock = socket.socket()
          sock.settimeout(5)
          result = sock.connect_ex(("192.0.2.1", 443))
          denied = {
              errno.EACCES,
              errno.EHOSTUNREACH,
              errno.ENETDOWN,
              errno.ENETUNREACH,
              errno.EPERM,
          }
          raise SystemExit(0 if result == 0 else 97 if result in denied else 98)
          PY

          cat >"${campaign_root}/child_probe.py" <<'PY'
          import subprocess
          import sys

          child = subprocess.run(
              [sys.executable, "/probe/direct_probe.py"],
              check=False,
          )
          raise SystemExit(child.returncode)
          PY

          export PHASE6_SYNTHETIC_HEADER_CANARY="phase6-synthetic-header-canary-${PHASE6_RUN_ID}-${PHASE6_RUN_ATTEMPT}"
          export PHASE6_SYNTHETIC_PAYLOAD_CANARY="phase6-synthetic-payload-canary-${PHASE6_RUN_ID}-${PHASE6_RUN_ATTEMPT}"
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          [[ -n "$host_uid" && "$host_uid" != *$'\n'* && "$host_uid" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ -n "$host_gid" && "$host_gid" != *$'\n'* && "$host_gid" =~ ^(0|[1-9][0-9]*)$ ]]
          diagnostic_stage="control"
          set +e
          docker run --network none --rm \
            --user "${host_uid}:${host_gid}" \
            --volume /bin:/bin:ro \
            --volume /etc:/etc:ro \
            --volume /lib:/lib:ro \
            --volume /lib64:/lib64:ro \
            --volume /usr:/usr:ro \
            --env "UV_PYTHON_INSTALL_DIR=${repository_root}/.tools/python" \
            --env UV_MANAGED_PYTHON=1 \
            --env UV_PYTHON_DOWNLOADS=never \
            --volume "${repository_root}:${repository_root}:ro" \
            --volume "${campaign_root}:/probe:rw" \
            --env PHASE6_SYNTHETIC_HEADER_CANARY \
            --env PHASE6_SYNTHETIC_PAYLOAD_CANARY \
            --workdir "${repository_root}" \
            "${image_tag}" \
            .venv/bin/python -I -m skillscout.application.phase6_adversarial_runner \
            --source-commit-sha "${PHASE6_SOURCE_COMMIT}" \
            --workflow-sha256 "sha256:${PHASE6_WORKFLOW_SHA256}" \
            --hosted-run-id "${PHASE6_RUN_ID}" \
            --run-attempt "${PHASE6_RUN_ATTEMPT}" \
            >"${campaign_root}/control.log" 2>&1
          control_status=$?

          diagnostic_stage="direct-probe"
          docker run --network none --rm \
            --volume /bin:/bin:ro \
            --volume /etc:/etc:ro \
            --volume /lib:/lib:ro \
            --volume /lib64:/lib64:ro \
            --volume /usr:/usr:ro \
            --env "UV_PYTHON_INSTALL_DIR=${repository_root}/.tools/python" \
            --env UV_MANAGED_PYTHON=1 \
            --env UV_PYTHON_DOWNLOADS=never \
            --volume "${repository_root}:${repository_root}:ro" \
            --volume "${campaign_root}:/probe:ro" \
            --workdir "${repository_root}" \
            "${image_tag}" \
            .tools/uv-0.11.29/bin/uv run --locked --offline --no-sync \
            python /probe/direct_probe.py \
            >"${campaign_root}/direct.log" 2>&1
          direct_status=$?

          diagnostic_stage="child-probe"
          docker run --network none --rm \
            --volume /bin:/bin:ro \
            --volume /etc:/etc:ro \
            --volume /lib:/lib:ro \
            --volume /lib64:/lib64:ro \
            --volume /usr:/usr:ro \
            --env "UV_PYTHON_INSTALL_DIR=${repository_root}/.tools/python" \
            --env UV_MANAGED_PYTHON=1 \
            --env UV_PYTHON_DOWNLOADS=never \
            --volume "${repository_root}:${repository_root}:ro" \
            --volume "${campaign_root}:/probe:ro" \
            --workdir "${repository_root}" \
            "${image_tag}" \
            .tools/uv-0.11.29/bin/uv run --locked --offline --no-sync \
            python /probe/child_probe.py \
            >"${campaign_root}/child.log" 2>&1
          child_status=$?
          set -e

          diagnostic_stage="campaign-report"
          test "${control_status}" -eq 0
          test "${direct_status}" -eq 97
          test "${child_status}" -eq 97
          test -s "${campaign_root}/campaign-report.json"

          diagnostic_stage="synthetic-scan"
          export PHASE6_CAMPAIGN_ROOT="${campaign_root}"
          export PHASE6_PRIOR_FAILED_PROBE_RUN_ID
          export PHASE6_CONTROL_OUTCOME="passed"
          export PHASE6_DIRECT_OUTCOME="denied"
          export PHASE6_CHILD_OUTCOME="denied"

          .tools/uv-0.11.29/bin/uv run --locked --offline --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PHASE6_CAMPAIGN_ROOT"])
          report_path = root / "campaign-report.json"
          report = json.loads(report_path.read_bytes())
          required_ids = tuple(report["required_scenario_ids"])
          completed_ids = tuple(report["completed_scenario_ids"])
          result_digests = tuple(report["scenario_result_digests"])
          if (
              len(required_ids) < 15
              or required_ids != completed_ids
              or len(result_digests) != len(required_ids)
              or report["controlled_scenario_count"] != len(required_ids)
              or report["untrusted_execution_count"] != 0
              or report["unapproved_network_effect_count"] != 0
              or report["unauthorized_effect_count"] != 0
              or report["synthetic_canary_hit_count"] != 0
          ):
              raise SystemExit("offline campaign report is incomplete")

          report_digest = "sha256:" + hashlib.sha256(
              report_path.read_bytes()
          ).hexdigest()
          sanitized_surface = {
              "schema_version": "phase6.sanitized-surface.v1",
              "campaign_report_digest": report_digest,
              "controlled_scenario_count": len(required_ids),
              "unauthorized_effect_count": 0,
          }
          (root / "redacted-state.json").write_text(
              json.dumps(sanitized_surface, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "one-day-artifact.json").write_text(
              json.dumps(sanitized_surface, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "pr-diff-fixture.txt").write_text(
              "sanitized-campaign-report " + report_digest + "\n",
              encoding="utf-8",
          )

          scan_names = ("control.log", "redacted-state.json", "campaign-report.json", "one-day-artifact.json", "pr-diff-fixture.txt")
          scanned = tuple(root / name for name in scan_names)
          canaries = (
              os.environ["PHASE6_SYNTHETIC_HEADER_CANARY"].encode(),
              os.environ["PHASE6_SYNTHETIC_PAYLOAD_CANARY"].encode(),
          )
          hit_count = sum(
              path.read_bytes().count(canary)
              for path in scanned
              for canary in canaries
          )
          if hit_count:
              raise SystemExit("synthetic canary reached an allowlisted surface")

          control_command = (
              ".venv/bin/python -I -m "
              "skillscout.application.phase6_adversarial_runner"
          )
          direct_command = (
              ".tools/uv-0.11.29/bin/uv run --locked --offline --no-sync "
              "python /probe/direct_probe.py\n"
          ).encode() + (root / "direct_probe.py").read_bytes()
          child_command = (
              ".tools/uv-0.11.29/bin/uv run --locked --offline --no-sync "
              "python /probe/child_probe.py\n"
          ).encode() + (root / "child_probe.py").read_bytes()
          evidence = {
              "schema_version": "phase6.offline-hosted-evidence.v1",
              "non_authoritative": True,
              "supersedes_failed_probe_run_id": os.environ[
                  "PHASE6_PRIOR_FAILED_PROBE_RUN_ID"
              ],
              "workflow_sha256": "sha256:"
              + os.environ["PHASE6_WORKFLOW_SHA256"],
              "source_commit_sha": os.environ["PHASE6_SOURCE_COMMIT"],
              "hosted_run_id": os.environ["PHASE6_RUN_ID"],
              "run_attempt": int(os.environ["PHASE6_RUN_ATTEMPT"]),
              "runner_image": (
                  os.environ.get("ImageOS", "ubuntu24")
                  + "-"
                  + os.environ.get("ImageVersion", "unknown")
              )[:128],
              "isolation_mechanism": "docker_network_none",
              "control_command_digest": "sha256:"
              + hashlib.sha256(control_command.encode()).hexdigest(),
              "direct_probe_command_digest": "sha256:"
              + hashlib.sha256(direct_command).hexdigest(),
              "child_probe_command_digest": "sha256:"
              + hashlib.sha256(child_command).hexdigest(),
              "control_outcome": os.environ["PHASE6_CONTROL_OUTCOME"],
              "direct_network_outcome": os.environ["PHASE6_DIRECT_OUTCOME"],
              "child_network_outcome": os.environ["PHASE6_CHILD_OUTCOME"],
              "scenario_matrix_digest": report["scenario_matrix_digest"],
              "required_scenario_ids": required_ids,
              "completed_scenario_ids": completed_ids,
              "scenario_result_digests": result_digests,
              "controlled_scenario_count": len(required_ids),
              "credential_count": 0,
              "state_write_capability": False,
              "untrusted_execution_count": 0,
              "unapproved_network_effect_count": 0,
              "unauthorized_effect_count": 0,
              "synthetic_scan_manifest": scan_names,
              "synthetic_scan_manifest_digest": "sha256:"
              + hashlib.sha256(
                  json.dumps(scan_names, separators=(",", ":")).encode()
              ).hexdigest(),
              "synthetic_canary_hit_count": hit_count,
              "artifact_retention_days": 1,
          }
          destination = root / "offline-evidence.json"
          destination.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          chmod 600 "${campaign_root}/offline-evidence.json"
          diagnostic_stage="complete"
          overall_status=0

      - name: Upload the bounded noncanonical campaign diagnostic
        if: ${{ always() && steps.offline_campaign.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-offline-adversarial-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase6-offline-adversarial/failure-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload the bounded noncanonical offline evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-offline-adversarial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase6-offline-adversarial/offline-evidence.json
          if-no-files-found: error
          retention-days: 1

  live_authority_preflight:
    if: ${{ inputs.phase6_action == 'run-benchmark' || inputs.phase6_action == 'run-replay' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      acceptance_run_id: ${{ steps.authority_handoff.outputs.acceptance_run_id }}
      authority_digest: ${{ steps.authority_handoff.outputs.authority_digest }}
      authority_state_commit_sha: ${{ steps.authority_handoff.outputs.authority_state_commit_sha }}
      authority_state_root_digest: ${{ steps.authority_handoff.outputs.authority_state_root_digest }}
      state_commit_sha: ${{ steps.authority_handoff.outputs.state_commit_sha }}
      state_root_digest: ${{ steps.authority_handoff.outputs.state_root_digest }}
      state_repository_id: ${{ steps.authority_handoff.outputs.state_repository_id }}
      state_repository_full_name: ${{ steps.authority_handoff.outputs.state_repository_full_name }}
      source_commit_sha: ${{ steps.authority_handoff.outputs.source_commit_sha }}
      manifest_digest: ${{ steps.authority_handoff.outputs.manifest_digest }}
    env:
      SKILLSCOUT_LLM_PROVIDER: deepseek
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      PHASE6_MANIFEST: .planning/phases/06-adversarial-mvp-acceptance/06-BENCHMARK-MANIFEST.json
      PHASE6_AUTHORITY_STATE_COMMIT_SHA: ${{ vars.SKILLSCOUT_PHASE6_AUTHORITY_STATE_COMMIT_SHA }}
      PHASE6_AUTHORITY_STATE_ROOT_DIGEST: ${{ vars.SKILLSCOUT_PHASE6_AUTHORITY_STATE_ROOT_DIGEST }}
      PHASE6_AUTHORITY_DIGEST: ${{ vars.SKILLSCOUT_PHASE6_AUTHORITY_DIGEST }}
      PHASE6_ACCEPTANCE_RUN_ID: ${{ vars.SKILLSCOUT_PHASE6_ACCEPTANCE_RUN_ID }}
      PHASE6_STATE_COMMIT_SHA: ${{ vars.SKILLSCOUT_PHASE6_STATE_COMMIT_SHA }}
      PHASE6_STATE_ROOT_DIGEST: ${{ vars.SKILLSCOUT_PHASE6_STATE_ROOT_DIGEST }}
      SKILLSCOUT_STATE_REPOSITORY_ID: ${{ vars.SKILLSCOUT_STATE_REPOSITORY_ID }}
      SKILLSCOUT_STATE_REPOSITORY_FULL_NAME: ${{ vars.SKILLSCOUT_STATE_REPOSITORY_FULL_NAME }}
    steps:
      - name: Check out the dispatched commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize the pinned uv binary
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.29
          enable-cache: false
      - name: Verify the repository-local locked toolchain
        run: |
          set -euo pipefail
          mkdir -p .tools/uv-0.11.29/bin
          install -m 0755 "$(command -v uv)" .tools/uv-0.11.29/bin/uv
          test -x .tools/uv-0.11.29/bin/uv
          uv_version_output="$(.tools/uv-0.11.29/bin/uv --version)"
          if [[ "$uv_version_output" != "uv 0.11.29" && ! "$uv_version_output" =~ ^uv\ 0\.11\.29\ \([^()]+\)$ ]]; then
            exit 1
          fi
          repository_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          test "${repository_root}" = "${GITHUB_WORKSPACE}"
          test "${repository_root}" = "$(pwd -P)"
          tools_root="${repository_root}/.tools"
          test ! -L "${tools_root}"
          test "$(realpath -e -- "${tools_root}")" = "${tools_root}"
          managed_python_root="${tools_root}/python"
          test "${managed_python_root}" = "${GITHUB_WORKSPACE}/.tools/python"
          if [[ -L "${managed_python_root}" ]]; then
            exit 1
          fi
          if [[ -e "${managed_python_root}" ]]; then
            test -d "${managed_python_root}"
            test "$(realpath -e -- "${managed_python_root}")" = "${managed_python_root}"
          else
            mkdir -m 0755 "${managed_python_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 .tools/uv-0.11.29/bin/uv python install 3.13.14 --install-dir "${managed_python_root}" --no-bin
          managed_python_executable="$(
            UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never \
              .tools/uv-0.11.29/bin/uv python find --managed-python 3.13.14
          )"
          [[ -n "$managed_python_executable" && "$managed_python_executable" != *$'\n'* && "$managed_python_executable" == /* ]]
          managed_python_executable="$(realpath -e -- "${managed_python_executable}")"
          case "${managed_python_executable}" in
            "${managed_python_root}"/*/bin/python*) ;;
            *) exit 1 ;;
          esac
          test -x "${managed_python_executable}"
          venv_root="${repository_root}/.venv"
          test "${venv_root}" = "${GITHUB_WORKSPACE}/.venv"
          if [[ -L "${venv_root}" ]]; then
            exit 1
          fi
          if [[ -e "${venv_root}" ]]; then
            test -d "${venv_root}"
            test "$(realpath -e -- "${venv_root}")" = "${venv_root}"
            rm -rf -- "${venv_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never .tools/uv-0.11.29/bin/uv sync --locked --python "${managed_python_executable}" --managed-python --no-python-downloads
          python_executable="$(realpath -e -- .venv/bin/python)"
          python_base_prefix="$(.venv/bin/python -I -c 'import sys; print(sys.base_prefix)')"
          [[ -n "$python_base_prefix" && "$python_base_prefix" != *$'\n'* && "$python_base_prefix" == /* ]]
          python_base_prefix="$(realpath -e -- "${python_base_prefix}")"
          case "${python_base_prefix}" in
            "${managed_python_root}"/*) ;;
            *) exit 1 ;;
          esac
          case "${python_executable}" in
            "${python_base_prefix}"/bin/python*) ;;
            *) exit 1 ;;
          esac
          test "$(.venv/bin/python -I -c 'import sys; print(sys.implementation.name)')" = "cpython"
          test "$(.venv/bin/python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          test -d "${python_base_prefix}/lib/python3.13"
          test -f "${python_base_prefix}/lib/python3.13/os.py"
          test -f "${python_base_prefix}/lib/python3.13/encodings/__init__.py"
          {
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "${managed_python_root}"
            printf 'UV_MANAGED_PYTHON=1\n'
            printf 'UV_PYTHON_DOWNLOADS=never\n'
          } >> "${GITHUB_ENV}"
      - name: Check out the exact independently approved authority state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PHASE6_AUTHORITY_STATE_COMMIT_SHA }}
          path: .phase6-authority-state
          persist-credentials: false
      - name: Verify every immutable live authority
        id: authority_handoff
        run: |
          set -euo pipefail
          test "$(git -C .phase6-authority-state rev-parse HEAD)" = "$PHASE6_AUTHORITY_STATE_COMMIT_SHA"
          handoff_file="${RUNNER_TEMP}/phase6-live-authority-handoff.json"
          .tools/uv-0.11.29/bin/uv run --locked python -m skillscout.cli verify-live-authority \
            --authority-state-root ".phase6-authority-state" \
            --authority-state-root-digest "$PHASE6_AUTHORITY_STATE_ROOT_DIGEST" \
            --acceptance-run-id "$PHASE6_ACCEPTANCE_RUN_ID" \
            --authority-digest "$PHASE6_AUTHORITY_DIGEST" \
            --source-commit-sha "${{ github.sha }}" \
            --runtime-state-commit-sha "$PHASE6_STATE_COMMIT_SHA" \
            --runtime-state-root-digest "$PHASE6_STATE_ROOT_DIGEST" \
            --state-repository-id "$SKILLSCOUT_STATE_REPOSITORY_ID" \
            --state-repository-full-name "$SKILLSCOUT_STATE_REPOSITORY_FULL_NAME" \
            > "$handoff_file"
          PHASE6_HANDOFF_FILE="$handoff_file" .venv/bin/python -I - <<'PY'
          import json
          import os
          import re

          payload = json.loads(open(os.environ["PHASE6_HANDOFF_FILE"], encoding="utf-8").read())
          payload["authority_state_commit_sha"] = os.environ["PHASE6_AUTHORITY_STATE_COMMIT_SHA"]
          payload["authority_state_root_digest"] = os.environ["PHASE6_AUTHORITY_STATE_ROOT_DIGEST"]
          required = {
              "acceptance_run_id",
              "authority_digest",
              "authority_state_commit_sha",
              "authority_state_root_digest",
              "state_commit_sha",
              "state_root_digest",
              "state_repository_id",
              "state_repository_full_name",
              "source_commit_sha",
              "manifest_digest",
          }
          if not required <= payload.keys():
              raise SystemExit("incomplete live authority handoff")
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as stream:
              for key in sorted(required):
                  value = str(payload[key])
                  if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:/-]{0,255}", value):
                      raise SystemExit("invalid live authority handoff")
                  stream.write(f"{key}={value}\n")
          PY

