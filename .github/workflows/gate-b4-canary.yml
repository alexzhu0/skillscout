name: Controlled Gate B4 catalog publication canary

# action-audit-sha256: f33b1b47c20db6f728522a0e176687c78c19a1d748783f2376d6e28bb67209bb
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  controlled_canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: skillscout-catalog-publish
    permissions:
      contents: read
    steps:
      - name: Check out the exact canary revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the exact locked uv tool
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.29
          enable-cache: false
      - name: Admit fixed identities before catalog credentials exist
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID }}
          SKILLSCOUT_CANARY_CATALOG_FULL_NAME: ${{ vars.SKILLSCOUT_CANARY_CATALOG_FULL_NAME }}
          SKILLSCOUT_CANARY_CATALOG_OWNER: ${{ vars.SKILLSCOUT_CANARY_CATALOG_OWNER }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY }}
          SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID: ${{ vars.SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID }}
          SKILLSCOUT_CANARY_REVIEWER: ${{ vars.SKILLSCOUT_CANARY_REVIEWER }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY: ${{ vars.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY }}
        run: |
          set -euo pipefail
          uv run --locked python tools/gate_b4_canary.py preflight
      - name: Mint one catalog-repository installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.SKILLSCOUT_GITHUB_APP_ID }}
          private-key: ${{ secrets.SKILLSCOUT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.SKILLSCOUT_CANARY_CATALOG_OWNER }}
          repositories: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run bounded positive and causal-denial probes
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID }}
          SKILLSCOUT_CANARY_CATALOG_FULL_NAME: ${{ vars.SKILLSCOUT_CANARY_CATALOG_FULL_NAME }}
          SKILLSCOUT_CANARY_CATALOG_OWNER: ${{ vars.SKILLSCOUT_CANARY_CATALOG_OWNER }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY }}
          SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID: ${{ vars.SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID }}
          SKILLSCOUT_CANARY_ACTUAL_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          SKILLSCOUT_CANARY_REVIEWER: ${{ vars.SKILLSCOUT_CANARY_REVIEWER }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY: ${{ vars.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY }}
          SKILLSCOUT_CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          evidence_file="$(mktemp)"
          trap 'rm -f "$evidence_file"' EXIT
          uv run --locked python tools/gate_b4_canary.py run | tee "$evidence_file"
          {
            echo '### Controlled Gate B4 canary evidence'
            echo
            echo '```json'
            cat "$evidence_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
