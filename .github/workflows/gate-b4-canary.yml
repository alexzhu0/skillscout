name: Controlled Gate B4 catalog publication canary

# action-audit-sha256: f33b1b47c20db6f728522a0e176687c78c19a1d748783f2376d6e28bb67209bb
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  controlled_canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: skillscout-catalog-publish
    permissions:
      contents: read
    steps:
      - name: Check out the exact canary revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the exact locked uv tool
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.29
          enable-cache: false
      - name: Verify the repository-local locked toolchain
        run: |
          set -euo pipefail
          repository_root="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          test "${repository_root}" = "${GITHUB_WORKSPACE}"
          test "${repository_root}" = "$(pwd -P)"
          tools_root="${repository_root}/.tools"
          if [[ -L "${tools_root}" ]]; then
            exit 1
          fi
          if [[ -e "${tools_root}" ]]; then
            test -d "${tools_root}"
          else
            mkdir -m 0755 "${tools_root}"
          fi
          test ! -L "${tools_root}"
          test "$(realpath -e -- "${tools_root}")" = "${tools_root}"
          mkdir -p .tools/uv-0.11.29/bin
          install -m 0755 "$(command -v uv)" .tools/uv-0.11.29/bin/uv
          test -x .tools/uv-0.11.29/bin/uv
          uv_version_output="$(.tools/uv-0.11.29/bin/uv --version)"
          if [[ "$uv_version_output" != "uv 0.11.29" && ! "$uv_version_output" =~ ^uv\ 0\.11\.29\ \([^()]+\)$ ]]; then
            exit 1
          fi
          managed_python_root="${tools_root}/python"
          test "${managed_python_root}" = "${GITHUB_WORKSPACE}/.tools/python"
          if [[ -L "${managed_python_root}" ]]; then
            exit 1
          fi
          if [[ -e "${managed_python_root}" ]]; then
            test -d "${managed_python_root}"
            test "$(realpath -e -- "${managed_python_root}")" = "${managed_python_root}"
          else
            mkdir -m 0755 "${managed_python_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 .tools/uv-0.11.29/bin/uv python install 3.13.14 --install-dir "${managed_python_root}" --no-bin
          managed_python_executable="$(
            UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never \
              .tools/uv-0.11.29/bin/uv python find --managed-python 3.13.14
          )"
          [[ -n "$managed_python_executable" && "$managed_python_executable" != *$'\n'* && "$managed_python_executable" == /* ]]
          managed_python_executable="$(realpath -e -- "${managed_python_executable}")"
          case "${managed_python_executable}" in
            "${managed_python_root}"/*/bin/python*) ;;
            *) exit 1 ;;
          esac
          test -x "${managed_python_executable}"
          venv_root="${repository_root}/.venv"
          test "${venv_root}" = "${GITHUB_WORKSPACE}/.venv"
          if [[ -L "${venv_root}" ]]; then
            exit 1
          fi
          if [[ -e "${venv_root}" ]]; then
            test -d "${venv_root}"
            test "$(realpath -e -- "${venv_root}")" = "${venv_root}"
            rm -rf -- "${venv_root}"
          fi
          UV_PYTHON_INSTALL_DIR="${managed_python_root}" UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never .tools/uv-0.11.29/bin/uv sync --locked --no-install-project --python "${managed_python_executable}" --managed-python --no-python-downloads
          python_executable="$(realpath -e -- .venv/bin/python)"
          python_base_prefix="$(.venv/bin/python -I -c 'import sys; print(sys.base_prefix)')"
          [[ -n "$python_base_prefix" && "$python_base_prefix" != *$'\n'* && "$python_base_prefix" == /* ]]
          python_base_prefix="$(realpath -e -- "${python_base_prefix}")"
          case "${python_base_prefix}" in
            "${managed_python_root}"/*) ;;
            *) exit 1 ;;
          esac
          case "${python_executable}" in
            "${python_base_prefix}"/bin/python*) ;;
            *) exit 1 ;;
          esac
          test "$(.venv/bin/python -I -c 'import sys; print(sys.implementation.name)')" = "cpython"
          test "$(.venv/bin/python -I -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.13.14"
          test -d "${python_base_prefix}/lib/python3.13"
          test -f "${python_base_prefix}/lib/python3.13/os.py"
          test -f "${python_base_prefix}/lib/python3.13/encodings/__init__.py"
          {
            printf 'UV_PYTHON_INSTALL_DIR=%s\n' "${managed_python_root}"
            printf 'UV_MANAGED_PYTHON=1\n'
            printf 'UV_PYTHON_DOWNLOADS=never\n'
          } >> "${GITHUB_ENV}"
      - name: Admit fixed identities before catalog credentials exist
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID }}
          SKILLSCOUT_CANARY_CATALOG_FULL_NAME: ${{ vars.SKILLSCOUT_CANARY_CATALOG_FULL_NAME }}
          SKILLSCOUT_CANARY_CATALOG_OWNER: ${{ vars.SKILLSCOUT_CANARY_CATALOG_OWNER }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY }}
          SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID: ${{ vars.SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID }}
          SKILLSCOUT_CANARY_REVIEWER: ${{ vars.SKILLSCOUT_CANARY_REVIEWER }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY: ${{ secrets.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_ID: ${{ vars.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_ID }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_IDENTITY_DIGEST: ${{ vars.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_IDENTITY_DIGEST }}
        run: |
          set -euo pipefail
          .tools/uv-0.11.29/bin/uv run --locked python tools/gate_b4_canary.py preflight
      - name: Mint one catalog-repository installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.SKILLSCOUT_GITHUB_APP_ID }}
          private-key: ${{ secrets.SKILLSCOUT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.SKILLSCOUT_CANARY_CATALOG_OWNER }}
          repositories: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run bounded positive and causal-denial probes
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY_ID }}
          SKILLSCOUT_CANARY_CATALOG_FULL_NAME: ${{ vars.SKILLSCOUT_CANARY_CATALOG_FULL_NAME }}
          SKILLSCOUT_CANARY_CATALOG_OWNER: ${{ vars.SKILLSCOUT_CANARY_CATALOG_OWNER }}
          SKILLSCOUT_CANARY_CATALOG_REPOSITORY: ${{ vars.SKILLSCOUT_CANARY_CATALOG_REPOSITORY }}
          SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID: ${{ vars.SKILLSCOUT_CANARY_EXPECTED_INSTALLATION_ID }}
          SKILLSCOUT_CANARY_ACTUAL_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          SKILLSCOUT_CANARY_REVIEWER: ${{ vars.SKILLSCOUT_CANARY_REVIEWER }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY: ${{ secrets.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_ID: ${{ vars.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_ID }}
          SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_IDENTITY_DIGEST: ${{ vars.SKILLSCOUT_CANARY_UNAUTHORIZED_PRIVATE_REPOSITORY_IDENTITY_DIGEST }}
          SKILLSCOUT_CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          evidence_file="$(mktemp)"
          trap 'rm -f "$evidence_file"' EXIT
          set +e
          .tools/uv-0.11.29/bin/uv run --locked python tools/gate_b4_canary.py run > "$evidence_file" 2>/dev/null
          status="$?"
          set -e
          if [ ! -s "$evidence_file" ]; then
            echo '{"schema_version":"skillscout.gate-b4-canary-error.v1","status":"failed_closed"}' > "$evidence_file"
          fi
          cat "$evidence_file"
          {
            echo '### Controlled Gate B4 canary evidence'
            echo
            echo '```json'
            cat "$evidence_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
